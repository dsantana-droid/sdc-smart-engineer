<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SDC SMART ENGINEER — Engenharia de Hardware com IA</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <img src="icon.svg" alt="Logo SDC" class="logo" />
        <div>
          <h1>SDC SMART ENGINEER</h1>
          <span class="badge">v1.0.0 • IA Google Gemini Ativa</span>
        </div>
      </div>

      <div class="api-box">
        <input
          type="password"
          id="apiKeyInput"
          placeholder="Cole sua Google Gemini API Key (AIza...)"
          autocomplete="off"
        />
        <button type="button" id="saveKeyBtn" class="btn-secondary">Salvar Chave</button>
        <span id="keyStatus" class="status-dot" title="Status da API Key"></span>
      </div>
    </header>

    <main class="workspace">
      <section class="panel input-panel">
        <div class="panel-header">
          <h2>1. Especificação de Hardware / Sistema</h2>
          <button type="button" id="loadExampleBtn" class="btn-link">Carregar exemplo</button>
        </div>

        <label for="projectType" class="field-label">Domínio do Projeto</label>
        <select id="projectType">
          <option value="embarcados">Sistemas Embarcados / IoT / Microcontroladores</option>
          <option value="potencia">Eletrônica de Potência / Fontes / Automação Industrial</option>
          <option value="pcb">Layout de PCB / Integridade de Sinal / EMC</option>
          <option value="geral">Especificação Geral de Produto Eletrônico</option>
        </select>

        <label for="specInput" class="field-label">Descrição Técnica, Requisitos ou Lista de Componentes</label>
        <textarea
          id="specInput"
          rows="12"
          placeholder="Descreva aqui a arquitetura, tensões de alimentação, microcontroladores, sensores, protocolos de comunicação, ambiente de operação e requisitos do projeto..."
        ></textarea>

        <div class="actions">
          <button type="button" id="clearBtn" class="btn-secondary">Limpar</button>
          <button type="button" id="analyzeBtn" class="btn-primary">Verificar Especificação com IA</button>
        </div>
      </section>

      <section class="panel output-panel">
        <div class="panel-header">
          <h2>2. Diagnóstico Técnico de Engenharia</h2>
          <button type="button" id="copyResultBtn" class="btn-link" disabled>Copiar relatório</button>
        </div>

        <div id="resultContainer" class="result-area empty">
          Preencha a especificação ao lado, configure sua chave do Google AI Studio no topo e clique em <strong>Verificar Especificação com IA</strong>.
        </div>

        <div class="followup-box" id="followupBox" hidden>
          <input
            type="text"
            id="followupInput"
            placeholder="Faça uma pergunta técnica sobre este diagnóstico (ex: Qual regulador LDO usar?)..."
          />
          <button type="button" id="followupBtn" class="btn-primary">Perguntar</button>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
